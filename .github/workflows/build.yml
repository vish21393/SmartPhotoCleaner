name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o SmartPhotoCleaner-AndroidProject.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: SmartPhotoCleaner
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPhotoCleaner-debug-apk
          path: SmartPhotoCleaner/app/build/outputs/apk/debug/app-debug.apk
          
