name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          for f in *.zip; do
            unzip -o "$f"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name "settings.gradle.kts" | head -n 1)")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPhotoCleaner-debug-apk
          path: "**/app-debug.apk"
          
